<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Non-Violent Communication</title>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --bg-color: #0f0f0f;
            --text-muted: #757575;
            --text-bright: #eeeeee;
            --highlight: #FFD700; /* Gold */
            --accent: #333;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* No scrollbars */
            color: var(--text-bright);
        }

        /* Main Container: Flex column to manage the three zones */
        #app {
            height: 100vh;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        /* --- THE THREE ZONES --- */
        
        /* 1. TOP ZONE: The "Pre-Text" */
        #zone-top {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            padding-bottom: 20px;
            
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.4;
            transition: opacity 0.2s ease; /* Sped up transition */
        }

        /* 2. MIDDLE ZONE: The "Phrase" (ANCHOR) */
        #zone-center {
            height: 120px; 
            flex-shrink: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }
        
        #phrase-display {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 800;
            color: var(--highlight);
            text-transform: lowercase; 
            letter-spacing: -0.5px;
            text-shadow: 0 4px 20px rgba(255, 215, 0, 0.15);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 3. BOTTOM ZONE: The "Post-Text" */
        #zone-bottom {
            flex: 1;
            display: flex;
            justify-content: flex-start; 
            align-items: center; 
            flex-direction: column;
            text-align: center;
            padding-top: 20px;
            
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.4;
            transition: opacity 0.2s ease; /* Sped up transition */
        }

        /* --- UTILS --- */
        .fade-out {
            opacity: 0;
            transform: translateY(10px);
        }

        /* Instructions Overlay */
        #instructions {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.85rem;
            color: #444;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Progress Bar */
        #progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: var(--highlight);
            width: 0%;
            transition: width 0.2s ease;
        }

    </style>
</head>
<body>

    <div id="progress"></div>

    <div id="app">
        <!-- Zone 1: Prefix -->
        <div id="zone-top">
            <span id="text-prefix"></span>
        </div>

        <!-- Zone 2: The Anchor Phrase -->
        <div id="zone-center">
            <div id="phrase-display">Phrase</div>
        </div>

        <!-- Zone 3: Suffix -->
        <div id="zone-bottom">
            <span id="text-suffix"></span>
        </div>
        
        <div id="instructions">Scroll / Swipe</div>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */

        // 1. DATA PREPARATION (Combined Original + New Phrases)
        const data = [
            // ORIGINAL PHRASES
            { phrase: "The thing is..", text: "I see the results for the teenagers. The thing is.. we didn't test any adults, so we can't say this works for everyone." },
            { phrase: "The thing is..", text: "The scale is easy to use. The thing is.. it isn't sensitive enough to measure the very small changes we are looking for." },
            { phrase: "The thing is..", text: "The final numbers look good. The thing is.. half the people quit the study early, so the data might be one-sided." },
            { phrase: "The thing is..", text: "I know we want to finish today. The thing is.. the plants need three more days to grow before we can measure them." },
            { phrase: "The thing is..", text: "The report is ready. The thing is.. the school board has a special format we have to follow for our writing." },
            
            { phrase: "Can we make an adjustment..", text: "The interview plan is good. Can we make an adjustment.. to the first question so it doesn't sound like we are nudging them to say 'yes'?" },
            { phrase: "Can we make an adjustment..", text: "The first test worked well. Can we make an adjustment.. and add 20 more people to the group to be extra sure of the result?" },
            { phrase: "Can we make an adjustment..", text: "I see you used a simple average. Can we make an adjustment.. and look at the middle number instead, since those two high scores are an accident?" },
            { phrase: "Can we make an adjustment..", text: "The lab is set up. Can we make an adjustment.. and wear double gloves for this part of the test just to be safe?" },
            { phrase: "Can we make an adjustment..", text: "I read the draft. Can we make an adjustment.. to the ending to be more honest about what we still don't know?" },

            { phrase: "I don't share the same sentiment..", text: "You think the medicine caused the change. I don't share the same sentiment.. because the change happened before they took the pill." },
            { phrase: "I don't share the same sentiment..", text: "You see a clear pattern here. I don't share the same sentiment..; to me, it looks like the dots are just scattered randomly." },
            { phrase: "I don't share the same sentiment..", text: "You think this is a huge discovery. I don't share the same sentiment.. yet; I think we need to do the test one more time to be sure." },
            { phrase: "I don't share the same sentiment..", text: "The group wants to focus on computers. I don't share the same sentiment.. because I think talking to people face-to-face gives better info." },
            { phrase: "I don't share the same sentiment..", text: "You think this other lab is great to work with. I don't share the same sentiment.. because they were very slow to share their notes last time." },

            { phrase: "My possible concern with that is..", text: "Testing only our friends is fast. My possible concern with that is.. that they might just tell us what they think we want to hear." },
            { phrase: "My possible concern with that is..", text: "Keeping the samples on the desk is fine for now. My possible concern with that is.. they might spoil if the room gets too warm at night." },
            { phrase: "My possible concern with that is..", text: "We took the names off the papers. My possible concern with that is.. that someone could still guess who the people are by their birthdays." },
            { phrase: "My possible concern with that is..", text: "The test worked perfectly in the quiet lab. My possible concern with that is.. it might not work at all in a noisy, busy house." },
            { phrase: "My possible concern with that is..", text: "This new app is fast for tracking. My possible concern with that is.. it crashes a lot on older phones." },

            { phrase: "I feel the other way around..", text: "You think being tired makes people sad. I feel the other way around..—I think being sad is what is keeping them from sleeping." },
            { phrase: "I feel the other way around..", text: "You think that high number is a mistake. I feel the other way around..; I think that is the most important part of the whole test." },
            { phrase: "I feel the other way around..", text: "You want to buy new tools. I feel the other way around..—I think we should spend the money on better books and sources." },
            { phrase: "I feel the other way around..", text: "You are looking at this like a science problem. I feel the other way around..—I think it is actually a problem with how people behave." },
            { phrase: "I feel the other way around..", text: "You think we should show the results now. I feel the other way around..—I think we should wait until we check the math again." },

            { phrase: "I appreciate the idea..", text: "I appreciate the idea.. of testing 100 people at once, but I’m worried we don't have enough chairs for everyone." },
            { phrase: "I appreciate the idea..", text: "I appreciate the idea.. of using a colorful chart, but a simple list might be easier for the boss to read quickly." },
            { phrase: "I appreciate the idea..", text: "I appreciate the idea.. of asking the history teacher for help, but let's make sure we explain our science goals to them first." },
            { phrase: "I appreciate the idea..", text: "I appreciate the idea.. of using big words to sound smart, but using simple words will help more people understand our work." },
            { phrase: "I appreciate the idea..", text: "I appreciate the idea.. of meeting every morning, but maybe once a week is enough so we have time to actually do the work." },

            // NEW PHRASES
            { phrase: "Well that", text: "The numbers show a clear upward trend. Well that might be true for the summer months, but what about the winter?" },
            { phrase: "Well that", text: "We can easily finish this by Friday. Well that would be ideal, but we still have three unchecked dependencies to resolve." },
            { phrase: "Well that", text: "We should just cut the marketing budget entirely. Well that is certainly an option, though it might hurt our overall sales next quarter." },
            { phrase: "Well that", text: "Everyone prefers the new design interface. Well that seems to be the consensus here, but the user feedback says otherwise." },
            { phrase: "Well that", text: "Let's push the update tonight to fix the bug. Well that solves the immediate issue, yet it risks introducing new errors without QA." },
            
            { phrase: "Ermmmmm I mean...", text: "I think we should use bright neon colors for the background. Ermmmmm I mean... I can see why that's eye-catching, but it might strain the users' eyes." },
            { phrase: "Ermmmmm I mean...", text: "You can just take over this entire project for me. Ermmmmm I mean... I'm flattered you trust me with it, but I'm currently at full capacity." },
            { phrase: "Ermmmmm I mean...", text: "We really don't need to test the old module. Ermmmmm I mean... it's usually stable, but it connects to the new database now so we should be careful." },
            { phrase: "Ermmmmm I mean...", text: "Let's just promise the client we will have it by tomorrow. Ermmmmm I mean... we could try, but I'd hate to overpromise and underdeliver." },
            { phrase: "Ermmmmm I mean...", text: "The best way forward is to rewrite the whole app. Ermmmmm I mean... a rewrite sounds clean, but an incremental update is a lot less risky." },

            { phrase: "As I understand it...", text: "The client said we absolutely have to use their servers. As I understand it... they prefer their servers, but are open to cloud options if we prove it's secure." },
            { phrase: "As I understand it...", text: "This feature covers everything the user wants. As I understand it... there were still a few edge cases we haven't mapped out yet." },
            { phrase: "As I understand it...", text: "Marketing is handling the launch entirely on their own. As I understand it... they are leading it, but our tech team needs to be on standby." },
            { phrase: "As I understand it...", text: "The drop-off rate means the site is broken. As I understand it... the drop-off is actually typical for a holiday weekend in this industry." },
            { phrase: "As I understand it...", text: "We can't change the terms of the agreement now. As I understand it... there is actually a 30-day window where amendments can still be filed." },

            { phrase: "Please correct me if I'm wrong", text: "We tried this approach last year and it failed. Please correct me if I'm wrong, but didn't it fail because we lacked the proper budget at the time?" },
            { phrase: "Please correct me if I'm wrong", text: "All the shipments go out on Tuesday mornings. Please correct me if I'm wrong, but I thought the overseas packages leave on Wednesdays." },
            { phrase: "Please correct me if I'm wrong", text: "Sarah is the sole owner of this module. Please correct me if I'm wrong, but wasn't David also assigned as a co-maintainer last week?" },
            { phrase: "Please correct me if I'm wrong", text: "The application only needs to support iOS devices. Please correct me if I'm wrong, but the initial project brief mentioned Android as well." },
            { phrase: "Please correct me if I'm wrong", text: "The servers are currently running at 100% capacity. Please correct me if I'm wrong, but I recall the dashboard showing 75% just a minute ago." },

            { phrase: "I'm coming at it from..", text: "We should focus purely on the visual design right now. I'm coming at it from.. an engineering perspective, where performance is my main worry." },
            { phrase: "I'm coming at it from..", text: "Adding more buttons gives the user more control. I'm coming at it from.. a new user's point of view, which might feel a bit overwhelming." },
            { phrase: "I'm coming at it from..", text: "This vendor is obviously the cheapest option. I'm coming at it from.. a long-term maintenance angle, where cheap often means more work later." },
            { phrase: "I'm coming at it from..", text: "We should target enterprise companies immediately. I'm coming at it from.. a risk-management side, preferring to test with smaller clients first." },
            { phrase: "I'm coming at it from..", text: "Mandatory overtime is the only way to finish this. I'm coming at it from.. a team morale standpoint, which could plummet if we do that." },

            { phrase: "My best knowledge of it is..", text: "There is no record of this bug ever happening before. My best knowledge of it is.. that it was logged in the legacy system three years ago." },
            { phrase: "My best knowledge of it is..", text: "We don't need user consent to collect this data. My best knowledge of it is.. that the new privacy laws require explicit opt-in for tracking." },
            { phrase: "My best knowledge of it is..", text: "Anyone on the team can approve the final release. My best knowledge of it is.. that only the project lead has the final sign-off authority." },
            { phrase: "My best knowledge of it is..", text: "They want the website to be entirely green. My best knowledge of it is.. that they wanted green accents, not necessarily the entire background." },
            { phrase: "My best knowledge of it is..", text: "This framework doesn't support mobile platforms at all. My best knowledge of it is.. that version 4 introduced full mobile compatibility last month." }
        ];

        // Randomize the data array (Fisher-Yates Shuffle)
        for (let i = data.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [data[i], data[j]] = [data[j], data[i]];
        }

        // 2. STATE & DOM ELEMENTS
        let currentIndex = 0;
        let isLocked = false; 

        const elPrefix = document.getElementById('text-prefix');
        const elPhrase = document.getElementById('phrase-display');
        const elSuffix = document.getElementById('text-suffix');
        const elProgress = document.getElementById('progress');
        
        const zoneTop = document.getElementById('zone-top');
        const zoneBottom = document.getElementById('zone-bottom');

        // 3. RENDER LOGIC
        function render(index) {
            const item = data[index];

            // Update Progress Bar
            const percent = ((index + 1) / data.length) * 100;
            elProgress.style.width = `${percent}%`;

            const parts = item.text.split(item.phrase);
            const prefix = parts[0] || "";
            const suffix = parts[1] || "";

            // Visual Fade Out
            zoneTop.style.opacity = 0;
            zoneBottom.style.opacity = 0;
            elPhrase.style.transform = "scale(0.9)";

            // Reduced delay for a snappier feel
            setTimeout(() => {
                elPrefix.textContent = prefix.trim();
                elPhrase.textContent = item.phrase; 
                elSuffix.textContent = suffix.trim();

                // Visual Fade In
                zoneTop.style.opacity = 1;
                zoneBottom.style.opacity = 1;
                elPhrase.style.transform = "scale(1)";
            }, 150);
        }

        // 4. NAVIGATION CONTROLLER
        function navigate(direction) {
            if (isLocked) return; 

            if (direction === 1) {
                if (currentIndex < data.length - 1) {
                    currentIndex++;
                    triggerLock();
                    render(currentIndex);
                }
            } else {
                if (currentIndex > 0) {
                    currentIndex--;
                    triggerLock();
                    render(currentIndex);
                }
            }
        }

        // 5. LOCKING MECHANISM 
        function triggerLock() {
            isLocked = true;
            // Reduced to 400ms. Still prevents touchpad-bounce but feels much more reactive.
            setTimeout(() => {
                isLocked = false;
            }, 400); 
        }

        // 6. INPUT HANDLERS
        window.addEventListener('wheel', (e) => {
            if (isLocked) return;
            if (Math.abs(e.deltaY) > 20) {
                if (e.deltaY > 0) navigate(1);
                else navigate(-1);
            }
        });

        let touchStartY = 0;
        let touchEndY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', (e) => {
            if (isLocked) return;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const yDiff = touchStartY - touchEndY;
            if (Math.abs(yDiff) > 40) {
                if (yDiff > 0) navigate(1); 
                else navigate(-1); 
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') navigate(1);
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') navigate(-1);
        });

        // Initialize
        render(currentIndex);

    </script>
</body>
</html>
